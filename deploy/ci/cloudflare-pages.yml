# ============================================================
# Cloudflare Pages 部署（无需服务器、无需 SSH）
# 使用前：
#   1) 仓库 Settings → Secrets 添加 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID
#   2) 把本文件移动到仓库根目录 .github/workflows/deploy-pages.yml
#   3) Cloudflare 控制台为项目绑定自定义域名（证书自动签发与续期）
#
# ⚠️ 体积提醒：本项目 assets/ 约 1.4GB，Cloudflare Pages 单文件上限 25MiB、
#    免费版每月 500 次构建。视频文件建议迁到 R2 并用自定义域分发，
#    只在 Pages 上托管 HTML / CSS / JS / 封面图。
# ============================================================
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 预检（体积与关键文件）
        run: |
          du -sh . || true
          test -f index.html || { echo "缺少 index.html"; exit 1; }
          BIG=$(find . -type f -size +25M -not -path './.git/*' | head -20)
          if [ -n "$BIG" ]; then
            echo "以下文件超过 25MiB，Pages 会拒绝上传："
            echo "$BIG"
            exit 1
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=portfolio --branch=main
