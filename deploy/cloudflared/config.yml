# ============================================================
# Cloudflare Tunnel 配置（路径 D：无公网 IP、无服务器也能用真域名上线）
# 适用：本机常开、想先用 https://你的域名 验证效果
# 安装：cloudflared（Windows: winget install Cloudflare.cloudflared）
# 步骤：
#   1) cloudflared tunnel login
#   2) cloudflared tunnel create portfolio
#   3) 把生成的 credentials 文件路径填到下方 credentials-file
#   4) cloudflared tunnel route dns portfolio 你的域名.com
#   5) cloudflared tunnel run portfolio
# 说明：证书由 Cloudflare 边缘自动签发与续期，本机无需 80/443、无需备案
# ============================================================

tunnel: portfolio
credentials-file: C:\Users\HP\.cloudflared\<tunnel-id>.json

ingress:
  # 主域名指向本机正在运行的静态服务（端口按实际调整）
  - hostname: 你的域名.com
    service: http://127.0.0.1:8377

  # www 一并接入（可选）
  - hostname: www.你的域名.com
    service: http://127.0.0.1:8377

  # 兜底规则，必须是最后一条
  - service: http_status:404
